<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Molecular 3D Renderer</title>
  <style>
    body {
      margin: 0;
      background-color: #1a1a1a;
      color: #c0c0c0;
      font-family: 'Courier New', monospace;
      font-size: 18px;
      padding: 10px;
    }
    
    .container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
    }
    
    .header {
      border: 1px solid #666;
      background: #2a2a2a;
      padding: 8px;
      margin-bottom: 10px;
      text-align: center;
    }
    
    .subtitle {
      color: #999;
      font-size: 12px;
      margin: 0;
      text-transform: uppercase;
    }
    
    .renderer-controls {
      background: #333;
      border: 1px solid #666;
      padding: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      gap: 5px;
    }
    
    .render-btn {
      background: #444;
      border: 1px solid #666;
      color: #ccc;
      padding: 6px 12px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      cursor: pointer;
      text-transform: uppercase;
    }
    
    .render-btn:hover {
      background: #555;
      border-color: #888;
    }
    
    .render-btn.active {
      background: #1a4a1a;
      border-color: #4a8a4a;
      color: #8f8;
    }
    
    #rendererContainer {
      width: 100%;
      height: 450px;
      background: #222;
      border: 2px inset #666;
      position: relative;
      margin-bottom: 10px;
    }
    
    .model-info {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #666;
      padding: 4px;
      font-size: 14px;
      color: #ccc;
      z-index: 10;
    }
    
    .model-title {
      color: #fff;
      font-weight: bold;
      margin-bottom: 2px;
    }
    
    .model-desc {
      color: #999;
      font-size: 12px;
    }
    
    .status-panel {
      background: #2a2a2a;
      border: 1px solid #666;
      margin-bottom: 10px;
    }
    
    .status-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 8px;
      border-bottom: 1px solid #444;
      font-size: 14px;
    }
    
    .status-row:last-child {
      border-bottom: none;
    }
    
    .status-label {
      color: #aaa;
    }
    
    .status-value {
      color: #8f8;
      font-family: monospace;
    }
    
    .status-value.critical {
      color: #f88;
    }
    
    .status-value.warning {
      color: #fa8;
    }
    
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ccc;
      font-size: 14px;
      z-index: 5;
    }
    
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #444;
      border-top: 2px solid #888;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .back-link {
      background: #444;
      border: 1px solid #666;
      color: #ccc;
      text-decoration: none;
      padding: 8px 16px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      display: inline-block;
      margin-top: 10px;
      text-transform: uppercase;
    }
    
    .back-link:hover {
      background: #555;
      border-color: #888;
    }
    
    .back-container {
      text-align: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #444;
    }
    
    @media (max-width: 700px) {
      body { padding: 5px; font-size: 15px; }
      #rendererContainer { height: 350px; }
      .renderer-controls { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="subtitle">Evolution Optimization Solutions - 3D Visualization Suite</div>
    </div>

    <div class="renderer-controls">
      <button class="render-btn active" onclick="renderVirus()">TITHONUS VIRUS</button>
      <button class="render-btn" onclick="renderAntigen()">ANTIGEN</button>
    </div>

    <div id="rendererContainer">
      <div class="model-info" id="modelInfo">
        <div class="model-title">TITHONUS Lentivirus</div>
        <div class="model-desc">Pathogenic structure analysis</div>
      </div>
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">Initializing molecular renderer...</div>
      </div>
      <canvas id="molecularScene"></canvas>
    </div>

    <div class="status-panel" id="statusPanel">
      <!-- Status will be populated by JavaScript -->
    </div>

    <div class="back-container">
      <a href="../archive.html" class="back-link">EXIT PROGRAM</a>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

    let scene, camera, renderer, currentModel;
    let animationId;
    let isInitialized = false;

    const virusData = {
      title: "TITHONUS",
      desc: "Pathogenic structure analysis",
      status: [
        { label: "Viral Classification:", value: "Lentivirus" },
        { label: "Infection Rate (R₀):", value: "23.7", class: "critical" },
        { label: "Mortality Rate:", value: "99.99%", class: "critical" },
        { label: "Spike Proteins Mapped:", value: "12/12" },
        { label: "Target:", value: "Human Genome" },
        { label: "Threat Level:", value: "EXTINCTION EVENT", class: "critical" }
      ]
    };

    const antigenData = {
      title: "Universal Antigen",
      desc: "Vaccine protein construct",
      status: [
        { label: "Confidence:", value: "99.97%" },
        { label: "Binding Affinity:", value: "HIGH (Kd: 0.23 nM)" },
        { label: "Cross-Variant Efficacy:", value: "96.4%" },
        { label: "Neutralizing Sites:", value: "14/14" },
        { label: "Immunogenicity Score:", value: "OPTIMAL" },
        { label: "Production Status:", value: "BLUEPRINT ONLY", class: "warning" }
      ]
    };

    function initRenderer() {
      if (isInitialized) return;
      
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, 1.5, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ 
        canvas: document.getElementById("molecularScene"), 
        alpha: true,
        antialias: true 
      });
      
      const container = document.getElementById("rendererContainer");
      const updateSize = () => {
        const rect = container.getBoundingClientRect();
        renderer.setSize(rect.width, rect.height);
        camera.aspect = rect.width / rect.height;
        camera.updateProjectionMatrix();
      };
      updateSize();
      window.addEventListener('resize', updateSize);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
      scene.add(ambientLight);
      
      const pointLight1 = new THREE.PointLight(0xff00ff, 1, 100);
      pointLight1.position.set(5, 5, 5);
      scene.add(pointLight1);
      
      const pointLight2 = new THREE.PointLight(0x00ffff, 0.8, 100);
      pointLight2.position.set(-5, -5, 5);
      scene.add(pointLight2);

      camera.position.set(0, 0, 4);
      isInitialized = true;
    }

    function createVirus() {
      const group = new THREE.Group();
      
      // Viral core
      const coreGeometry = new THREE.SphereGeometry(0.8, 16, 12);
      const coreMaterial = new THREE.MeshStandardMaterial({ 
        color: 0x4a1a4a,
        transparent: true,
        opacity: 0.8
      });
      const coreMesh = new THREE.Mesh(coreGeometry, coreMaterial);
      group.add(coreMesh);
      
      // Viral envelope
      const envelopeGeometry = new THREE.SphereGeometry(1.1, 20, 16);
      const envelopeMaterial = new THREE.MeshStandardMaterial({ 
        color: 0x2a0845,
        wireframe: true,
        transparent: true,
        opacity: 0.6
      });
      const envelopeMesh = new THREE.Mesh(envelopeGeometry, envelopeMaterial);
      group.add(envelopeMesh);
      
      // Spike proteins - menacing red spikes
      for (let i = 0; i < 12; i++) {
        const spikeGeometry = new THREE.ConeGeometry(0.1, 0.8, 8);
        const spikeMaterial = new THREE.MeshStandardMaterial({ 
          color: 0xff3366,
          emissive: 0x220011
        });
        const spikeMesh = new THREE.Mesh(spikeGeometry, spikeMaterial);
        
        const phi = Math.acos(-1 + (2 * i) / 12);
        const theta = Math.sqrt(12 * Math.PI) * phi;
        
        spikeMesh.position.setFromSphericalCoords(1.4, phi, theta);
        spikeMesh.lookAt(0, 0, 0);
        spikeMesh.rotateX(Math.PI);
        
        group.add(spikeMesh);
      }
      
      return group;
    }

    function createAntigen() {
      const group = new THREE.Group();
      
      // Main antigen structure - Y-shaped antibody
      const bodyGeometry = new THREE.CylinderGeometry(0.15, 0.15, 1.5, 12);
      const bodyMaterial = new THREE.MeshStandardMaterial({ 
        color: 0x00aa88,
        emissive: 0x002244
      });
      const bodyMesh = new THREE.Mesh(bodyGeometry, bodyMaterial);
      group.add(bodyMesh);
      
      // Binding arms
      for (let i = 0; i < 2; i++) {
        const armGeometry = new THREE.CylinderGeometry(0.12, 0.12, 1.0, 10);
        const armMaterial = new THREE.MeshStandardMaterial({ 
          color: 0x0088ff,
          emissive: 0x001133
        });
        const armMesh = new THREE.Mesh(armGeometry, armMaterial);
        
        armMesh.position.set(i === 0 ? -0.6 : 0.6, 0.4, 0);
        armMesh.rotation.z = (i === 0 ? 1 : -1) * Math.PI / 4;
        
        group.add(armMesh);
        
        // Binding sites at arm ends
        const bindingGeometry = new THREE.SphereGeometry(0.2, 12, 8);
        const bindingMaterial = new THREE.MeshStandardMaterial({ 
          color: 0x00ff88,
          emissive: 0x004422
        });
        const bindingMesh = new THREE.Mesh(bindingGeometry, bindingMaterial);
        
        bindingMesh.position.set(i === 0 ? -1.1 : 1.1, 0.8, 0);
        group.add(bindingMesh);
      }
      
      // Variable regions (the business end)
      for (let i = 0; i < 6; i++) {
        const varGeometry = new THREE.SphereGeometry(0.08, 8, 6);
        const varMaterial = new THREE.MeshStandardMaterial({ 
          color: 0xffaa00,
          emissive: 0x332200
        });
        const varMesh = new THREE.Mesh(varGeometry, varMaterial);
        
        const angle = (i / 6) * Math.PI * 2;
        const radius = 0.3;
        varMesh.position.set(
          Math.cos(angle) * radius,
          1.2 + Math.sin(angle) * 0.1,
          Math.sin(angle) * radius
        );
        
        group.add(varMesh);
      }
      
      return group;
    }

    function updateStatus(data) {
      const statusPanel = document.getElementById('statusPanel');
      statusPanel.innerHTML = data.status.map(item => 
        `<div class="status-row">
          <span class="status-label">${item.label}</span>
          <span class="status-value ${item.class || ''}">${item.value}</span>
        </div>`
      ).join('');
    }

    function animate() {
      animationId = requestAnimationFrame(animate);
      
      if (currentModel) {
        currentModel.rotation.y += 0.005;
        currentModel.rotation.x += 0.003;
        
        const time = Date.now() * 0.001;
        
        // Different animations based on model type
        if (currentModel.userData.type === 'virus') {
          // Virus: pulse envelope and spikes
          if (currentModel.children[1]) {
            currentModel.children[1].scale.setScalar(1 + 0.05 * Math.sin(time * 0.8));
          }
        } else if (currentModel.userData.type === 'antigen') {
          // Antigen: pulse binding sites
          currentModel.children.slice(-8).forEach((child, index) => {
            child.scale.setScalar(1 + 0.2 * Math.sin(time * 2 + index * 0.5));
          });
        }
      }
      
      renderer.render(scene, camera);
    }

    function showLoading(text = "Loading molecular structure...") {
      document.getElementById('loadingOverlay').style.display = 'flex';
      document.getElementById('loadingText').textContent = text;
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    window.renderVirus = function() {
      showLoading("Rendering TITHONUS viral structure...");
      
      // Update UI
      document.querySelectorAll('.render-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      const modelInfo = document.getElementById('modelInfo');
      modelInfo.querySelector('.model-title').textContent = virusData.title;
      modelInfo.querySelector('.model-desc').textContent = virusData.desc;
      
      updateStatus(virusData);
      
      setTimeout(() => {
        initRenderer();
        
        if (currentModel) {
          scene.remove(currentModel);
        }
        
        currentModel = createVirus();
        currentModel.userData.type = 'virus';
        scene.add(currentModel);
        
        if (!animationId) {
          animate();
        }
        
        hideLoading();
      }, 1000);
    };

    window.renderAntigen = function() {
      showLoading("Loading VAX_SIM_3D_SPIKE_NODE.bin...");
      
      // Update UI
      document.querySelectorAll('.render-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      const modelInfo = document.getElementById('modelInfo');
      modelInfo.querySelector('.model-title').textContent = antigenData.title;
      modelInfo.querySelector('.model-desc').textContent = antigenData.desc;
      
      updateStatus(antigenData);
      
      setTimeout(() => {
        initRenderer();
        
        if (currentModel) {
          scene.remove(currentModel);
        }
        
        currentModel = createAntigen();
        currentModel.userData.type = 'antigen';
        scene.add(currentModel);
        
        if (!animationId) {
          animate();
        }
        
        hideLoading();
      }, 1000);
    };

    // Initialize with virus view immediately
    document.addEventListener('DOMContentLoaded', () => {
      // Auto-start with virus view
      setTimeout(() => {
        const virusBtn = document.querySelector('.render-btn');
        if (virusBtn) {
          // Simulate the click to initialize everything properly
          virusBtn.dispatchEvent(new Event('click'));
        }
      }, 100);
    });
  </script>
</body>
</html>
