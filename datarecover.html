<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EOS Data Recovery</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .terminal {
      background: black;
      color: #00ff00;
      font-family: monospace;
      font-size: 14px;
      padding: 1rem;
      height: 300px;
      overflow-y: auto;
      border: 2px inset #444;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 p-8">
  <h1 class="text-2xl font-bold mb-4">EOS Data Recovery Utility</h1>
  <div id="terminal" class="terminal"></div>

  <h2 class="text-xl font-semibold mt-6">📂 Recovered Files</h2>
  <ul id="recoveredFiles" class="list-disc list-inside mt-2 text-blue-400">
    <!-- You update these manually when adding new files -->
  </ul>

  <a href="archive.html" class="text-blue-400 mt-6 inline-block">← Back to Archive</a>

  <script>
    const terminal = document.getElementById("terminal");

    function randomHex(len = 6) {
      let hex = "";
      for (let i = 0; i < len; i++) {
        hex += Math.floor(Math.random() * 16).toString(16).toUpperCase();
      }
      return hex;
    }

    function makeLogs() {
      return [
        `Scanning sector 0x${randomHex(8)} ...`,
        `Corrupt block detected @ offset 0x${randomHex(5)}`,
        `Rebuilding index table from 0x${randomHex(4)}:${randomHex(4)} ...`,
        `Cross-linked fragment at 0x${randomHex(7)} ignored`,
        `Decryption key mismatch on block 0x${randomHex(6)}`,
        `Reallocation attempt failed @ cluster 0x${randomHex(5)}`,
        `Checksum invalid for header 0x${randomHex(4)}`,
        `Sector repair queued [${randomHex(3)}%]`,
      ];
    }

    function addLog() {
      const logs = makeLogs();
      const log = document.createElement("div");
      log.textContent = logs[Math.floor(Math.random() * logs.length)];
      terminal.appendChild(log);
      terminal.scrollTop = terminal.scrollHeight;
    }

    addLog();
    setInterval(addLog, 1500);
  </script>
</body>
</html>
